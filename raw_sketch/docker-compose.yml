# LCFLIGHT stack: MQTT broker + web app
#
# Configuration:
#   - Copy backend/.env.example to backend/.env and set your values.
#   - The app is served at http://localhost:3000.
#
# Usage:
#   docker compose up -d

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: lcflight-mosquitto
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    restart: unless-stopped

  app:
    build: .
    container_name: lcflight-app
    env_file:
      - backend/.env
    environment:
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
    ports:
      - "3000:3000"
    volumes:
      - lcflight-data:/app/data
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  lcflight-data: