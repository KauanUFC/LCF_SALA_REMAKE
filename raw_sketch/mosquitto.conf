listener 1883 0.0.0.0
allow_anonymous true

# --- Instruções de uso ---
# Modo local (sem bridge): comente as linhas "connection hivemq-cloud" até "keepalive_interval"
#   e execute: MQTT_BROKER=mqtt://localhost:1883 node app.js
# Modo cloud (padrão): dashboard conecta ao HiveMQ diretamente, bridge é opcional

# --- Bridge para HiveMQ (cloud) ---
# Comente as linhas abaixo se quiser rodar apenas localmente sem bridge
connection hivemq-cloud
address broker.hivemq.com:1883

# Telemetria: cloud → local (in) — ESP32 publica no HiveMQ, bridge entrega ao broker local
topic esp32/+/telemetry in 2
topic esp32/+/status in 2

# Comandos: local → cloud (out) — dashboard publica no broker local, bridge envia ao HiveMQ
topic esp32/+/cmd/led out 2

try_private true
cleansession false
notifications false
keepalive_interval 60