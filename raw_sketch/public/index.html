<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Telemetry Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 8px; font-size: 28px; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; font-size: 14px; }

    .status-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; padding: 10px 14px; background: #1e293b; border-radius: 8px; border: 1px solid #334155; flex-wrap: wrap; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .status-dot.green { background: #22c55e; }
    .status-dot.red { background: #ef4444; }
    .status-dot.yellow { background: #eab308; }
    .status-label { color: #94a3b8; font-size: 12px; }
    .status-sep { color: #334155; margin: 0 8px; }

    /* Add form */
    .add-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #38bdf8; color: #0f172a; }
    .btn-success { background: #22c55e; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-outline { background: transparent; border: 1px solid #334155; color: #94a3b8; }
    .btn-outline:hover { border-color: #38bdf8; color: #38bdf8; }
    .btn-sm { padding: 6px 14px; font-size: 12px; }

    .add-form { display: none; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; align-items: flex-end; width: 100%; }
    .add-form.visible { display: flex; }
    .add-form .field { display: flex; flex-direction: column; gap: 4px; }
    .add-form label { font-size: 12px; color: #94a3b8; }
    .add-form input { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; color: #e2e8f0; font-size: 14px; min-width: 160px; }
    .add-form input:focus { outline: none; border-color: #38bdf8; }
    .add-form .btn-row { display: flex; gap: 8px; }

    /* Device cards grid */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }

    .device-card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow: hidden; }
    .device-card.error { border-color: #ef4444; }
    .device-card.connecting { border-color: #eab308; }

    .card-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #0f172a; border-bottom: 1px solid #334155; }
    .card-header-info { display: flex; flex-direction: column; gap: 2px; }
    .card-header-info .name { font-size: 15px; font-weight: 700; color: #e2e8f0; }
    .card-header-info .meta { font-size: 12px; color: #64748b; }
    .card-header-info .meta span { color: #94a3b8; }
    .card-header .close-btn { background: none; border: none; color: #64748b; font-size: 20px; cursor: pointer; padding: 4px; line-height: 1; }
    .card-header .close-btn:hover { color: #ef4444; }

    .card-body { padding: 16px; }

    .conn-status { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 13px; }
    .conn-status .text { color: #94a3b8; }
    .conn-status .error-text { color: #ef4444; }

    .telemetry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .t-item {}
    .t-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; margin-bottom: 2px; }
    .t-value { font-size: 16px; font-weight: 700; }
    .t-value.green { color: #22c55e; }
    .t-value.red { color: #ef4444; }
    .t-value.yellow { color: #eab308; }
    .t-value.blue { color: #38bdf8; }

    .cmd-section { border-top: 1px solid #334155; padding-top: 14px; }
    .cmd-section h4 { font-size: 13px; color: #94a3b8; margin-bottom: 10px; }
    .cmd-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .cmd-label { font-size: 13px; color: #e2e8f0; font-weight: 600; min-width: 50px; }
    .btn-cmd-on { background: #22c55e; color: #fff; }
    .btn-cmd-off { background: #ef4444; color: #fff; }
    .mode-selector { display: flex; gap: 14px; align-items: center; font-size: 13px; }
    .mode-selector label { cursor: pointer; display: flex; align-items: center; gap: 4px; color: #94a3b8; font-size: 12px; }
    .mode-selector input[type="radio"] { accent-color: #38bdf8; }

    .no-devices { text-align: center; padding: 60px 20px; color: #64748b; }
    .no-devices p { font-size: 16px; margin-bottom: 8px; }
    .no-devices .hint { font-size: 13px; color: #475569; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ESP32 Telemetry</h1>
    <p class="subtitle">Multi-device monitoring & control</p>

    <div class="status-bar">
      <span class="status-dot red" id="brokerDot"></span>
      <span class="status-label">Broker</span>
      <span id="brokerStatus" style="color:#94a3b8;font-size:13px">checking...</span>
      <span style="color:#334155;margin:0 8px">|</span>
      <span style="color:#94a3b8;font-size:12px" id="deviceCount">0 devices</span>
    </div>

    <div class="add-bar">
      <button class="btn btn-primary" id="addBtn">+ Add ESP32</button>
      <a href="/ota.html" class="btn btn-outline">OTA Update</a>
    </div>

    <div class="add-form" id="addForm">
      <div class="field">
        <label for="devName">Name</label>
        <input type="text" id="devName" placeholder="Kitchen ESP">
      </div>
      <div class="field">
        <label for="devDesc">Description</label>
        <input type="text" id="devDesc" placeholder="Controls kitchen LED strip">
      </div>
      <div class="field">
        <label for="devIp">IP / mDNS</label>
        <input type="text" id="devIp" placeholder="192.168.1.42 or esp32.local">
      </div>
      <div class="btn-row">
        <button class="btn btn-success" id="connectBtn">Connect</button>
        <button class="btn btn-outline" id="cancelBtn">Cancel</button>
      </div>
    </div>

    <div id="cardContainer">
      <div class="no-devices" id="emptyState">
        <p>No devices connected</p>
        <p class="hint">Click "+ Add ESP32" to get started</p>
      </div>
    </div>
  </div>

  <script>
    let devices = {};
    let sseConnected = false;
    const TELEMETRY_STALE_MS = 20000;

    // --- SSE ---
    let evtSource = null;
    function connectSSE() {
      if (evtSource) evtSource.close();
      evtSource = new EventSource("/events");
      evtSource.addEventListener("device_update", (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === "status") handleStatus(msg.deviceId, msg.data);
          else if (msg.type === "telemetry") handleTelemetry(msg.deviceId, msg.data);
          else if (msg.type === "remove") handleRemove(msg.deviceId);
        } catch (e) {
          console.error("SSE parse error:", e);
        }
      });
      evtSource.onerror = () => { sseConnected = false; };
      evtSource.onopen = () => { sseConnected = true; };
    }
    connectSSE();

    // --- Helpers ---
    function fmtBytes(bytes) {
      if (bytes == null) return "---";
      if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " MB";
      if (bytes >= 1024) return (bytes / 1024).toFixed(1) + " KB";
      return bytes + " B";
    }
    function fmtUptime(s) {
      if (s == null) return "---";
      const days = Math.floor(s / 86400);
      const hours = Math.floor((s % 86400) / 3600);
      const mins = Math.floor((s % 3600) / 60);
      const secs = s % 60;
      if (days > 0) return `${days}d ${hours}h ${mins}m`;
      if (hours > 0) return `${hours}h ${mins}m ${secs}s`;
      if (mins > 0) return `${mins}m ${secs}s`;
      return `${secs}s`;
    }

    function esc(str) {
      if (!str) return "";
      return String(str).replace(/[&<>"']/g, function(m) {
        if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; if (m === '"') return '&quot;'; return '&#39;';
      });
    }

    // --- Card rendering ---
    function renderCard(d) {
      const isConnecting = d.status === "connecting";
      const isError = d.status === "error";
      const isConnected = d.status === "connected";
      const hasTelemetry = isConnected && d.lastTelemetry;
      const isStale = hasTelemetry && d.lastTelemetryTs && (Date.now() - d.lastTelemetryTs) > TELEMETRY_STALE_MS;
      const tel = d.lastTelemetry || {};
      const borderClass = isError ? "error" : isConnecting ? "connecting" : isStale ? "error" : "";

      let statusHtml = "";
      if (isConnecting) {
        statusHtml = `<span class="status-dot yellow"></span><span class="text">Connecting to ${esc(d.ip)}...</span>`;
      } else if (isError) {
        statusHtml = `<span class="status-dot red"></span><span class="error-text">${esc(d.error)}</span> <button class="btn btn-sm btn-outline" onclick="retryDevice('${d.id}')">Retry</button>`;
      } else if (isConnected && !hasTelemetry) {
        statusHtml = `<span class="status-dot green"></span><span class="text">Connected — awaiting telemetry...</span>`;
      } else if (isStale) {
        statusHtml = `<span class="status-dot red"></span><span class="error-text">Disconnected — no data for ${Math.floor((Date.now() - d.lastTelemetryTs) / 1000)}s</span>`;
      } else if (isConnected) {
        statusHtml = `<span class="status-dot green"></span><span class="text">Connected</span>`;
      }

      const telHtml = hasTelemetry && !isStale ? `
        <div class="telemetry-grid">
          <div class="t-item"><div class="t-label">Device</div><div class="t-value blue">${esc(tel.device_id || "---")}</div></div>
          <div class="t-item"><div class="t-label">LED</div><div class="t-value ${tel.led_state === "on" ? "green" : "red"}">${esc(tel.led_state || "---")}</div></div>
          <div class="t-item"><div class="t-label">RSSI</div><div class="t-value ${tel.rssi > -60 ? "green" : tel.rssi > -80 ? "yellow" : "red"}">${tel.rssi != null ? tel.rssi + " dBm" : "---"}</div></div>
          <div class="t-item"><div class="t-label">Free Heap</div><div class="t-value">${fmtBytes(tel.free_heap)}</div></div>
          <div class="t-item"><div class="t-label">Uptime</div><div class="t-value">${fmtUptime(tel.uptime_s)}</div></div>
          <div class="t-item"><div class="t-label">Temp (CPU)</div><div class="t-value">${tel.temp_cpu != null ? tel.temp_cpu.toFixed(1) + " °C" : "---"}</div></div>
          <div class="t-item"><div class="t-label">MQTT</div><div class="t-value ${tel.mqtt_connected ? "green" : "red"}">${tel.mqtt_connected ? "Connected" : "Disconnected"}</div></div>
          <div class="t-item"><div class="t-label">WiFi</div><div class="t-value ${tel.wifi_connected ? "green" : "red"}">${tel.wifi_connected ? "Connected" : "Disconnected"}</div></div>
        </div>
      ` : (isConnected ? `<div class="telemetry-grid"><div class="t-item" style="grid-column:1/-1"><div class="t-label" style="color:#64748b;text-align:center;padding:20px 0">Waiting for telemetry data...</div></div></div>` : "");

      const cmdHtml = (isConnected && !isStale) ? `
        <div class="cmd-section">
          <h4>Commands</h4>
          ${d.commands.map(c => `
            <div class="cmd-row">
              <span class="cmd-label">${esc(c.label)}</span>
              ${c.actions.map(a => `<button class="btn btn-sm ${a === "on" ? "btn-cmd-on" : "btn-cmd-off"}" onclick="sendCommand('${d.id}','${c.id}','${a}')">${a.toUpperCase()}</button>`).join("")}
            </div>
          `).join("")}
          <div class="mode-selector">
            <span style="color:#94a3b8;font-size:12px">Mode:</span>
            <label><input type="radio" name="mode_${d.id}" value="http" ${d.commandMode === "http" ? "checked" : ""} onchange="setMode('${d.id}','http')"> HTTP</label>
            <label><input type="radio" name="mode_${d.id}" value="mqtt" ${d.commandMode === "mqtt" ? "checked" : ""} onchange="setMode('${d.id}','mqtt')"> MQTT</label>
          </div>
        </div>
      ` : "";

      const macStr = d.mac ? esc(d.mac) : (isConnecting ? "---" : "---");

      return `
        <div class="device-card ${borderClass}" id="card_${d.id}">
          <div class="card-header">
            <div class="card-header-info">
              <div class="name">${esc(d.name)}</div>
              <div class="meta">${esc(d.ip)} <span>|</span> ${macStr} ${d.description ? `<span>|</span> ${esc(d.description)}` : ""}</div>
            </div>
            <button class="close-btn" onclick="removeDevice('${d.id}')">&times;</button>
          </div>
          <div class="card-body">
            <div class="conn-status">${statusHtml}</div>
            ${telHtml}
            ${cmdHtml}
            ${d.cmdMsg ? `<div style="margin-top:8px;font-size:12px;color:#94a3b8">${esc(d.cmdMsg)}</div>` : ""}
          </div>
        </div>
      `;
    }

    function renderAll() {
      const container = document.getElementById("cardContainer");
      const ids = Object.keys(devices);
      if (ids.length === 0) {
        container.innerHTML = `<div class="no-devices" id="emptyState"><p>No devices connected</p><p class="hint">Click "+ Add ESP32" to get started</p></div>`;
        document.getElementById("deviceCount").textContent = "0 devices";
        return;
      }
      container.innerHTML = ids.map(id => renderCard(devices[id])).join("");
      document.getElementById("deviceCount").textContent = `${ids.length} device${ids.length > 1 ? "s" : ""}`;
    }

    // --- SSE handlers ---
    function handleStatus(id, data) {
      if (!devices[id]) {
        devices[id] = { id, name: data.name || id, description: data.description || "", ip: data.ip || "?", mac: data.mac, deviceId: data.deviceId, status: data.status, error: data.error, lastTelemetry: null, lastTelemetryTs: 0, commands: data.commands || [{ id: "led", label: "LED", type: "binary", actions: ["on", "off"] }], commandMode: data.commandMode || "http" };
      } else {
        const d = devices[id];
        d.status = data.status;
        if (data.mac) d.mac = data.mac;
        if (data.deviceId) d.deviceId = data.deviceId;
        if (data.error) d.error = data.error;
        if (data.commands) d.commands = data.commands;
        if (data.name) d.name = data.name;
        if (data.description) d.description = data.description;
        if (data.ip) d.ip = data.ip;
        if (data.commandMode) d.commandMode = data.commandMode;
      }
      renderAll();
    }

    function handleTelemetry(id, data) {
      if (!devices[id]) return;
      devices[id].lastTelemetry = data;
      devices[id].lastTelemetryTs = Date.now();
      renderAll();
    }

    function handleRemove(id) {
      delete devices[id];
      renderAll();
    }

    // --- Actions ---
    function sendCommand(deviceId, commandId, action) {
      const d = devices[deviceId];
      if (!d) return;
      d.cmdMsg = "Sending...";
      renderAll();
      fetch(`/api/devices/${deviceId}/command`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ commandId, action })
      }).then(r => r.json()).then(data => {
        d.cmdMsg = data.error ? "Error: " + data.error : `${commandId} → ${action}`;
        setTimeout(() => { d.cmdMsg = null; renderAll(); }, 3000);
        renderAll();
      }).catch(e => {
        d.cmdMsg = "Error: " + e.message;
        setTimeout(() => { d.cmdMsg = null; renderAll(); }, 3000);
        renderAll();
      });
    }

    function setMode(deviceId, mode) {
      fetch(`/api/devices/${deviceId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ commandMode: mode })
      }).catch(e => console.error("Mode error:", e));
    }

    function removeDevice(deviceId) {
      fetch(`/api/devices/${deviceId}`, { method: "DELETE" }).catch(e => console.error("Remove error:", e));
    }

    function retryDevice(deviceId) {
      const d = devices[deviceId];
      if (!d) return;
      fetch("/api/devices", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: d.name, description: d.description, ip: d.ip })
      }).then(r => r.json()).then(newDev => {
        removeDevice(deviceId);
      }).catch(e => console.error("Retry error:", e));
    }

    // --- Broker status + device sync ---
    async function checkBroker() {
      try {
        const res = await fetch("/api/config");
        const cfg = await res.json();
        const dot = document.getElementById("brokerDot");
        const status = document.getElementById("brokerStatus");
        dot.className = "status-dot " + (cfg.mqtt_connected ? "green" : "red");
        status.textContent = cfg.mqtt_connected ? "Connected" : "Disconnected";
      } catch {}
      try {
        const res = await fetch("/api/devices");
        const list = await res.json();
        list.forEach(d => {
          if (!devices[d.id]) {
            d.lastTelemetry = d.lastTelemetry || null;
            devices[d.id] = d;
          }
        });
        renderAll();
      } catch {}
    }
    checkBroker();
    setInterval(checkBroker, 5000);

    // --- Add form ---
    document.getElementById("addBtn").addEventListener("click", () => {
      document.getElementById("addForm").classList.add("visible");
      document.getElementById("devName").focus();
    });

    document.getElementById("cancelBtn").addEventListener("click", () => {
      document.getElementById("addForm").classList.remove("visible");
      document.getElementById("devName").value = "";
      document.getElementById("devDesc").value = "";
      document.getElementById("devIp").value = "";
    });

    document.getElementById("connectBtn").addEventListener("click", async () => {
      const name = document.getElementById("devName").value.trim();
      const ip = document.getElementById("devIp").value.trim();
      const desc = document.getElementById("devDesc").value.trim();
      if (!name || !ip) return;

      document.getElementById("connectBtn").disabled = true;
      document.getElementById("connectBtn").textContent = "Connecting...";

      try {
        const res = await fetch("/api/devices", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, description: desc, ip })
        });
        if (!res.ok) {
          const err = await res.json();
          alert("Error: " + (err.error || "Unknown"));
        } else {
          const device = await res.json();
          handleStatus(device.id, device);
        }
      } catch (e) {
        alert("Connection error: " + e.message);
      }

      document.getElementById("connectBtn").disabled = false;
      document.getElementById("connectBtn").textContent = "Connect";
      document.getElementById("addForm").classList.remove("visible");
      document.getElementById("devName").value = "";
      document.getElementById("devDesc").value = "";
      document.getElementById("devIp").value = "";
    });

    // Enter key on IP field submits
    document.getElementById("devIp").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("connectBtn").click();
    });
  </script>
</body>
</html>
